[package]
name = "notecraft-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "NoteCraft installation setup helper"

[[bin]]
name = "notecraft-setup"
path = "src/main.rs"

[dependencies]
notecraft-store = { workspace = true }

# Only the setup program's own message boxes use it; the library half is shared with Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { workspace = true }

[lints]
workspace = true
