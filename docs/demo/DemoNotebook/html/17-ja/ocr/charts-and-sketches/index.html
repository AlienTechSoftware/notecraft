<p>このページは OCR デモの一部です。ステータス：グラフは <b>MVP</b>。スケッチは後の段階です。</p>
<p>棒グラフは数値を画像の中に持っています。NoteCraft は読める文字、たとえばタイトルやラベルを読み取ります。棒はまだ数値として読み取られません。</p>
<p><img src="assets/ocr-chart.png" alt="「作成されたノート（月別）」というタイトルの棒グラフ。九月（12）、十月（25）、十一月（31）の棒がある"></p>
<p>手描きのスケッチはもっと難しいです。その文字は読めることがありますが、箱や矢印はまだ理解されません。</p>
<p><img src="assets/ocr-sketch.png" alt="ホワイトボードの簡単なスケッチ。「受信箱」の箱から「アーカイブ」の箱へ矢印があり、「レビュー」の楕円から「毎週」の文字へ線がつながっている"></p>
