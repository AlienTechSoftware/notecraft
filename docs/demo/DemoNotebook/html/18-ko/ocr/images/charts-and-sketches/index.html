<p><i>Draft translation: please check it with a native speaker before release.</i></p>
<p>이 페이지는 OCR 데모의 일부입니다. 상태: 차트는 <b>MVP</b>이며, 스케치는 이후 단계입니다.</p>
<p>막대 차트는 숫자를 그림 안에 담고 있습니다. NoteCraft는 제목이나 레이블처럼 읽을 수 있는 단어를 읽습니다. 막대는 아직 숫자로 읽지 않습니다.</p>
<p><img src="assets/ocr-chart.png" alt="월별 생성된 노트라는 제목의 막대 차트, 9월(12), 10월(25), 11월(31)의 막대가 있음"></p>
<p>손으로 그린 스케치는 더 어렵습니다. 그 안의 단어는 읽을 수 있을지 모르지만, 상자와 화살표는 아직 이해하지 못합니다.</p>
<p><img src="assets/ocr-sketch.png" alt="화이트보드 스케치: 받은편지함 상자에서 보관함 상자로 가는 화살표, 그리고 검토 타원에서 매주라는 단어로 이어지는 선"></p>
