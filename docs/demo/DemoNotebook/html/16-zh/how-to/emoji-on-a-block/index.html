<p>每个块的左上角都有一个小小的 <b>+</b>。点击它打开表情网格。 选择一个表情，它会出现在 <b>+</b> 旁边。要去掉某个表情，点击块上的那个表情即可。</p>
<h2>试一试</h2>
<ol>
<li>点击本块左上角的 <b>+</b>。</li>
<li>滚动网格，选择一个表情。它会出现在 <b>+</b> 旁边。</li>
<li>点击块上的这个表情。它就消失了。</li>
</ol>
<h2>块上已有的表情</h2>
<p data-nc-emoji="💡 📌">这一段有两个表情：一个灯泡和一个图钉。</p>
<p data-nc-emoji="✅ 🎉">这一段有一个勾号和一个彩纸礼炮。</p>
<p>表情会随页面一起保存，所以再次打开笔记本时它们仍然在。 它们写在页面文件里，任何编辑器都能读取。</p>
