[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask", "docs/demo/scripts"]
default-members = ["crates/*", "apps/notecraft", "apps/notecraft-cli", "xtask"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlienTechSoftware/notecraft"
publish = false

[workspace.dependencies]
notecraft-model = { path = "crates/model" }
notecraft-math = { path = "crates/math" }
notecraft-diagram = { path = "crates/diagram" }
notecraft-ink = { path = "crates/ink" }
notecraft-formats = { path = "crates/formats" }
notecraft-text = { path = "crates/text" }
notecraft-onenote = { path = "crates/onenote" }
notecraft-import = { path = "crates/import" }
notecraft-store = { path = "crates/store" }
notecraft-engine = { path = "crates/engine" }
notecraft-mcp = { path = "crates/mcp" }
notecraft-ui-egui = { path = "crates/ui-egui" }

# Versions match the sibling Craft apps (storytold/wordcraft).
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["image", "file", "svg_text"] }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
serde_json = "1"
# Equations: a pure Rust, KaTeX compatible TeX maths typesetter. Pinned exactly, because it is
# 0.x and young; the adapter in crates/math is the only place that names it.
# Diagrams: a pure Rust Mermaid renderer. Pinned exactly, because it is 0.x and young; only
# crates/diagram names it.
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
ratex-font = "=0.1.15"
# Build time only, Windows only: puts the icon and the version into the .exe files.
winresource = "0.1"
# The system file and folder dialogs, for "Open a notebook folder". UI only.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# The clipboard, for pictures. egui hands us text only, and eframe already uses this
# crate for its own text clipboard, so nothing new enters the build.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
# The log facade. The app routes it into its log file (apps/notecraft/src/applog.rs).
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0


