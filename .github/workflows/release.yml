# Publishes artifacts from a separately-run Packaging workflow as a draft GitHub Release.
#
# Run Packaging first, then run this workflow by hand with its run ID. Nothing is published
# automatically: the release is a draft, and every 0.x or -pre version is marked a pre-release.
# See docs/releasing.md.
#
# Signing: packaging/windows/sign.ps1 signs when WINDOWS_CERTIFICATE or the AZURE_* secrets exist
# and leaves the files unsigned, with a warning, when they do not. No secret is set today, so
# these builds are unsigned and Windows SmartScreen will warn.
name: Release

on:
  workflow_dispatch:
    inputs:
      packaging_run_id:
        description: "Successful Packaging workflow run ID whose artifacts should be published"
        required: true
        type: string
      version:
        description: "Version override for a test run, e.g. 0.1.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Draft release from packaging artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the draft release
    # Signing secrets, when they exist, live in the `release` environment.
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          v="${v#v}"
          if [ -z "$v" ]; then
            v="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # Pre-release until the owner says otherwise: every 0.x and every -pre version.
          case "$v" in 0.*|*-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### NoteCraft v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - name: Download artifacts from the selected Packaging run
        run: gh run download "${{ inputs.packaging_run_id }}" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'notecraft-*'
      - name: Confirm packaging artifacts exist
        run: |
          test -n "$(find dist -type f -print -quit)"
          find dist -type f -maxdepth 4 -print

      - name: Draft the GitHub Release
        shell: bash
        run: |
          tag="v${{ steps.v.outputs.version }}"
          flags=(--draft --target "$GITHUB_SHA" --title "NoteCraft $tag" --generate-notes)
          if [ "${{ steps.v.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          notes="**Alpha.** NoteCraft is not a finished product. It has had little use, and the folder format can still change. Keep a backup of any notebook you care about.

          These files are **not signed**: Windows SmartScreen may show \"Windows protected your PC\".
          Choose More info, then Run anyway. Check a download against \`SHA256SUMS.txt\`, or with
          \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`.

          Your notebooks are plain folders under Documents\NoteCraft, and neither the installer nor
          an uninstall touches them. The app writes \`notecraft.log\` in \`%APPDATA%\NoteCraft\`: attach it
          to a bug report at https://github.com/${GITHUB_REPOSITORY}/issues. What is missing is listed in
          docs/gaps.md."
          mapfile -t artifacts < <(find dist -type f -print)
          gh release create "$tag" "${artifacts[@]}" "${flags[@]}" --notes "$notes"
