# Deploy website/ (notecraft.cloud) to Azure Static Web Apps.
#
# Exercised live on 2026-11-04 via PR #37: the Azure deploy itself works; the first run's demo fetch
# failed exactly as this file originally predicted (openplayground hadn't rebuilt the pushed commit yet)
# and, at the time, correctly failed the whole job rather than deploy a mismatched demo — which also meant
# the landing page didn't deploy either, even though it has nothing to do with openplayground. Fixed: the
# "Fetch the demo build" step below is now best-effort and never fails the job. The site (landing page,
# everything except demo/) always deploys. The demo falls back, in order: (1) the build matching the exact
# commit being deployed, (2) the newest available onenote-head-*.zip build (a commit or two behind, loudly
# warned in the run's log), (3) no demo this run (website/demo/ stays empty) if neither exists.
#
# What this buys, why the website lives in this repo instead of its own:
#   - Every push to main that touches website/** redeploys the production site.
#   - Every pull_request gets its own live preview URL (Azure Static Web Apps' built-in preview
#     environments, free tier allows 3) — this is the whole reason the site is a subfolder here rather
#     than a separate repo: Azure's preview-per-PR only works when the Static Web App is linked to the
#     same repo the PR is opened against.
#
# Needs one repository secret: AZURE_STATIC_WEB_APPS_API_TOKEN (the Azure Static Web App's deployment
# token — create the Free-tier resource first, then copy its token here; never commit it). Set on
# AlienTechSoftware/notecraft 2026-11-04.
#
# The demo build (website/demo/, gitignored — see .gitignore) is NOT built in this workflow. It is built
# continuously by daijro/openplayground's own pipeline (patches/onenote.yaml, scripts/build.mjs), which
# tracks this repo's `main` on its "head" channel and publishes the result as a GitHub release asset named
# onenote-head-<short-sha>-<patch-hash>.zip on daijro/openplayground's `builds` release (tag "builds").
# This workflow downloads that asset instead of re-running the whole patch+trunk+wasm-opt pipeline a
# second time inside this repo.

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:
    # Manual production redeploy with no source change (e.g. to retry once openplayground has
    # caught up to a commit, or to refresh the live demo after a notecraft change with no website
    # change of its own). Always deploys the demo build matching main's current tip.

permissions:
  contents: read
  pull-requests: write # Azure's action comments the preview URL on the PR

concurrency:
  group: deploy-website-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  # Closing (or merging) a PR tears down its preview environment. No demo fetch needed for a close.
  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close

  deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the demo build (best-effort — never blocks the site deploy)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          mkdir -p website/demo
          short_sha="${SHA:0:7}"
          asset=$(gh release view builds --repo daijro/openplayground --json assets \
            --jq ".assets[] | select(.name | test(\"^onenote-head-${short_sha}-\")) | .name" | head -1)
          if [ -z "$asset" ]; then
            echo "::warning::No onenote-head-${short_sha}-*.zip asset yet on daijro/openplayground's 'builds' release (its own pipeline polls ~15 min). Falling back to the newest available build so the site still deploys, with a demo that may be a commit or two behind."
            asset=$(gh release view builds --repo daijro/openplayground --json assets \
              --jq '[.assets[] | select(.name | test("^onenote-head-"))] | sort_by(.updated_at) | last | .name')
          fi
          if [ -z "$asset" ] || [ "$asset" = "null" ]; then
            echo "::warning::No onenote-head-*.zip asset exists at all on daijro/openplayground's 'builds' release. Deploying the site with no demo this run — website/demo/ stays empty."
            exit 0
          fi
          echo "Using $asset"
          if ! gh release download builds --repo daijro/openplayground --pattern "$asset" --dir /tmp/demo-zip; then
            echo "::warning::Could not download $asset — deploying the site with no demo this run."
            exit 0
          fi
          # ARCHIVE in build.mjs is "tar" on Windows dev hosts, "zip" on GitHub runners (linux) — this
          # runs on ubuntu-latest, so the asset is a real zip.
          unzip -q "/tmp/demo-zip/$asset" -d website/demo

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: "website"
          output_location: ""
          skip_app_build: true
