name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup install
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers
      - name: Install Rust
        run: rustup install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  platform-build-test:
    name: build/test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers
      - name: Install Rust
        run: rustup install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Show disk space
        if: matrix.platform == 'linux'
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h /
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Run workspace tests with infrastructure-only retry (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -o pipefail
          set +e
          cargo test --workspace --locked 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then exit 0; fi
          if grep -Eq 'No space left on device|IO failure on output stream|Bus error|signal 7' cargo-test.log; then
            echo "Retrying after an infrastructure/resource failure"
            cargo test --workspace
            exit $?
          fi
          exit "$status"
      - name: Run workspace tests
        if: matrix.platform != 'linux'
        run: cargo test --workspace --locked

  voice:
    # The optional dictation feature is off in default builds, so the workspace jobs above never
    # compile it. Build, lint and test it here, with the ALSA headers the microphone needs.
    name: voice (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers
      - name: Install Rust
        run: rustup install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: voice
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check macOS microphone metadata
        if: matrix.platform == 'macos'
        run: plutil -lint packaging/OSX/Info.plist.in packaging/OSX/entitlements.plist
      - run: cargo clippy -p craft-voice-core -p craft-voice-runtime -p notecraft-ui-egui -p notecraft --all-targets --locked --features craft-voice-runtime/microphone,notecraft/voice -- -D warnings
      - run: cargo test -p craft-voice-core -p craft-voice-runtime --locked --features craft-voice-runtime/microphone
      - run: cargo test -p notecraft-ui-egui --locked --features voice --lib app::voice

  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup install
      - name: Branch check
        run: cargo xtask check-branch
      - name: PII scanner
        run: bash SKILLS/nc-devx/scripts/check-pii.sh
      - name: Layers
        run: cargo xtask layers
      - name: Assets
        run: cargo xtask assets
      - name: Docs
        run: cargo xtask docs
      - name: Text
        run: cargo xtask text
      - name: Demo check
        run: cargo xtask demo-check

  coverage:
    name: coverage (warns, never blocks)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers
      - name: Install Rust and cargo-llvm-cov
        run: |
          rustup install
          rustup component add llvm-tools
          cargo install cargo-llvm-cov --locked --version 0.9.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Show disk space
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h /
      - run: cargo xtask coverage

  ci-status:
    name: CI
    runs-on: ubuntu-latest
    needs: [fmt, clippy, platform-build-test, voice, static, coverage]
    if: always()
    steps:
      - name: Check CI result
        run: |
          if [[ "${{ needs.fmt.result }}" == "failure" || "${{ needs.clippy.result }}" == "failure" || "${{ needs.platform-build-test.result }}" == "failure" || "${{ needs.voice.result }}" == "failure" || "${{ needs.static.result }}" == "failure" ]]; then
            echo "Quality checks failed"
            exit 1
          fi
          echo "CI checks passed"
