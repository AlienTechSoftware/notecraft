name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  RUST_BACKTRACE: "1"

jobs:
  # Decides whether the Rust jobs need to run at all. A pull request that only touches prose
  # (Markdown at the top level, `docs/` apart from the files tests read, `SKILLS/`, `work/`)
  # cannot change a build or a test result, so it skips the build, test, clippy and coverage
  # jobs; fmt and the static checks (links, text style, PII) still run on it. Pushes to main
  # and manual runs always run everything.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both sides of a rename count: moving code into docs/ is a code change.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          code=false
          # The files API stops at 3000 entries; a list that long or an empty one is not trusted.
          if [[ "$count" -eq 0 || "$count" -ge 3000 ]]; then code=true; fi
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              # Read by tests: the demo notebooks, the generated command list, the coverage baseline.
              docs/demo/* | docs/commands.md | docs/coverage.json) code=true ;;
              docs/* | SKILLS/* | work/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "$count changed paths; Rust jobs needed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup install
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers
      - name: Install Rust
        run: rustup install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  platform-build-test:
    name: build/test (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux stays at two compile jobs: more ran the runner out of disk and memory
          # (see the infrastructure retry below). The macOS (3 cores) and Windows (4 cores)
          # runners have no such trouble, and two jobs left a core idle for every build.
          - platform: linux
            runner: ubuntu-24.04
            build-jobs: "2"
          - platform: windows
            runner: windows-2025
            build-jobs: "4"
          - platform: macos
            runner: macos-15
            build-jobs: "3"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: ${{ matrix.build-jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers
      - name: Install Rust
        run: rustup install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Show disk space
        if: matrix.platform == 'linux'
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h /
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Run workspace tests with infrastructure-only retry (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -o pipefail
          set +e
          cargo test --workspace --locked 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then exit 0; fi
          if grep -Eq 'No space left on device|IO failure on output stream|Bus error|signal 7' cargo-test.log; then
            echo "Retrying after an infrastructure/resource failure"
            cargo test --workspace
            exit $?
          fi
          exit "$status"
      - name: Run workspace tests
        if: matrix.platform != 'linux'
        run: cargo test --workspace --locked

  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup install
      - name: Branch check
        run: cargo xtask check-branch
      - name: PII scanner
        run: bash SKILLS/nc-devx/scripts/check-pii.sh
      - name: Layers
        run: cargo xtask layers
      - name: Assets
        run: cargo xtask assets
      - name: Docs
        run: cargo xtask docs
      - name: Text
        run: cargo xtask text
      - name: Demo check
        run: cargo xtask demo-check

  coverage:
    name: coverage (warns, never blocks)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      NC_LLVM_COV_VERSION: "0.9.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers
      - name: Install Rust and LLVM tools
        run: |
          rustup install
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Restore the tool after rust-cache: binaries present before that action
      # starts are excluded from its saved cache. Keep this cache to one file.
      - name: Cache coverage tool
        id: coverage-tool-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-ubuntu24-${{ runner.arch }}-${{ env.NC_LLVM_COV_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Ensure pinned coverage tool
        run: |
          if [[ "$(cargo llvm-cov --version 2>/dev/null || true)" != "cargo-llvm-cov $NC_LLVM_COV_VERSION" ]]; then
            cargo install cargo-llvm-cov --locked --version "$NC_LLVM_COV_VERSION" --force
          fi
          coverage_tool_version="$(cargo llvm-cov --version)"
          echo "$coverage_tool_version"
          [[ "$coverage_tool_version" == "cargo-llvm-cov $NC_LLVM_COV_VERSION" ]]
      - name: Show disk space
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h /
      - run: cargo xtask coverage

  ci-status:
    name: CI
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy, platform-build-test, static, coverage]
    if: always()
    steps:
      - name: Check CI result
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          BUILD_TEST: ${{ needs.platform-build-test.result }}
          STATIC: ${{ needs.static.result }}
        run: |
          # The change filter must have succeeded: if it failed, the jobs it gates were skipped,
          # and a skip must never pass as a green run.
          if [[ "$CHANGES" != "success" ]]; then
            echo "The change filter did not succeed ($CHANGES)"
            exit 1
          fi
          for result in "$FMT" "$STATIC"; do
            if [[ "$result" != "success" ]]; then echo "Quality checks failed"; exit 1; fi
          done
          for result in "$CLIPPY" "$BUILD_TEST"; do
            if [[ "$CODE" == "true" && "$result" != "success" ]] || [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Quality checks failed"
              exit 1
            fi
          done
          if [[ "$CODE" != "true" ]]; then echo "Only prose changed: build, test, clippy and coverage were skipped"; fi
          echo "CI checks passed"
