[package]
name = "notecraft-input-language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Small platform adapter for the active keyboard input language"

# The workspace forbids unsafe code in UI and application crates. This adapter isolates the
# one documented Windows API call; everything exposed to its callers is safe Rust.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
