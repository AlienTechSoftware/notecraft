[package]
name = "notecraft-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "NoteCraft egui front end. Swappable: nothing below it depends on egui"

[lints]
workspace = true

[features]
default = []
voice = ["dep:craft-voice-core", "dep:craft-voice-runtime"]

[dependencies]
craft-voice-core = { workspace = true, optional = true }
craft-voice-runtime = { workspace = true, optional = true, features = ["microphone"] }
craft-i18n = { workspace = true }
notecraft-input-language = { path = "../input-language" }
notecraft-model = { workspace = true }
notecraft-ink = { workspace = true }
notecraft-text = { workspace = true }
notecraft-math = { workspace = true }
notecraft-formats = { workspace = true }
notecraft-store = { workspace = true }
notecraft-engine = { workspace = true }
notecraft-import = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
notecraft-diagram = { workspace = true }
rfd = { workspace = true }
image = { workspace = true }
hayro = { workspace = true }
log = { workspace = true }
arboard = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
# SystemTime::now()/Instant::now() panic on wasm32-unknown-unknown; see the workspace Cargo.toml.
web-time = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
fontdb = "0.23"

[dev-dependencies]
egui_kittest = { workspace = true }
# The icon tests share one offscreen GPU device instead of building one per picture.
egui-wgpu = "0.37"


